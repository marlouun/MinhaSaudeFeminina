name: Build e testes

on:
  push:
    branches:
      - main
      - codex/offline-local-admin
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Normalizar e permitir execucao do Gradle Wrapper
        run: |
          sed -i 's/\r$//' ./gradlew
          chmod +x ./gradlew

      - name: Testes unitarios Android
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Gerar APK de depuracao
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Guardar relatorios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Guardar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: minha-saude-feminina-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
